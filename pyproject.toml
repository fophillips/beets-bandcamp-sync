[project]
name = "beets-bandcamp-sync"
version = "0.1.2"
description = "Synchronize Bandcamp album purchases into beets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fred Phillips" }]
keywords = ["bandcamp", "beets", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "beets>=2.4",
    "beetcamp>=0.23",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/fophillips/beets-bandcamp-sync"
Issues = "https://github.com/fophillips/beets-bandcamp-sync/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["beetsplug*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

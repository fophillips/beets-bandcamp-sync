name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            beets: "beets==2.4.*"
          - python-version: "3.12"
            beets: "beets==2.5.*"
          - python-version: "3.14"
            beets: "beets"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "${{ matrix.beets }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
